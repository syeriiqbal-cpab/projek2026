<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPAB JKR - Portal Korporat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            scroll-behavior: smooth;
        }

        .tab-active { 
            background-color: #fda927; 
            color: white !important; 
            font-weight: 700; 
            box-shadow: 0 10px 15px -3px rgba(253, 169, 39, 0.4); 
        }

        .glass-effect { 
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .animate-fade-in { 
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; 
        }

        /* Skrol Bar Kustom */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #179898; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #0e6e6e; }

        /* Garisan Organisasi */
        .org-line-v { width: 1px; background-color: #e2e8f0; height: 40px; margin: 0 auto; }
        .org-line-h { height: 1px; background-color: #e2e8f0; width: 100%; }

        .text-shadow-sm { text-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .list-item-hover:hover {
            background-color: #f1f5f9;
            padding-left: 1.5rem;
        }
        .list-item-hover {
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="bg-[#F8FAFC] text-[#334155]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Komponen Ikon Kustom
        const Icon = ({ name, size = 18, className = "" }) => {
            const icons = {

                users: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
                fileText: <><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14.5 2 14.5 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/><line x1="8" y1="9" x2="10" y2="9"/></>,
                calendar: <><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>,
                mapPin: <><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></>,

                phone: <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>,
                search: <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,

                menu: <><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/></>,
                chevronRight: <polyline points="9 18 15 12 9 6"/>,
                book: <><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></>,
                bookOpen: <><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>,
                externalLink: <><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></>,
                facebook: <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>,
                twitter: <path d="M22 4s-.7 2.1-2 3.4c1.6 10-94 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/>,
                megaphone: <><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></>,
                image: <><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></>,
                award: <><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></>,
                target: <><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></>,
                chart: <><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></>,
                mail: <><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></>,
                layers: <><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></>,
                folder: <><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93l-1.41-1.41A2 2 0 0 0 9.24 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"/></>,
                mousePointer: <><path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="m13 13 6 6"/></>,
                sparkles: <><path d="m12 3 1.912 5.886L20 10.8l-5.886 1.912L12 18.6l-1.912-5.886L4.2 10.8l5.886-1.912z"/><path d="M5 3 6.3 7 10 8.3 6.3 9.6 5 13.6 3.7 9.6 0 8.3 3.7 7z"/><path d="M20 13l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/></>,
                ribbon: <><path d="M12 15l-3 3.5V5h6v13.5l-3-3.5z"/><path d="M9 18l-5 3V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16l-5-3"/></>,
                eye: <><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></>,
                check: <><polyline points="20 6 9 17 4 12"/></>
            };

            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width={size} 
                    height={size} 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={className}
                >
                    {icons[name]}
                </svg>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [selectedDirektoriUnit, setSelectedDirektoriUnit] = useState(null);
            const [selectedPublication, setSelectedPublication] = useState(null);
            const [selectedArchiveItem, setSelectedArchiveItem] = useState(null);

            const sparDriveLink = "https://drive.google.com/drive/folders/1qvxYWu6uBor0atIcrgo90PS3ejvlEyan?usp=sharing";
            const eksaDriveLink = "https://drive.google.com/drive/folders/141kBpDPblpipDDHkGv2dkJHcZrU4Hrie?usp=sharing";

            const quickLinks = [
                { title: "SISTEM PENDAFTARAN & PELUPUSAN REKOD", url: "https://sppr.jkr.gov.my/", logo: "LOGO SISTEM 1.JPG" },
                { title: "VALUE AT ENTRY", url: "https://vae.jkr.gov.my/", logo: "LOGO SISTEM 2.JPG" },
                { title: "JPEDIA", url: "https://jpedia.jkr.gov.my/index.php/Frontpage", logo: "LOGO SISTEM 3.JPG" },
                { title: "JCOP", url: "https://jcop.vms.my/", logo: "LOGO SISTEM 4.JPG" }
            ];

            const newsData = [
                { title: "Majlis Amanat Tahun 2026 Pengarah Kanan CPAB", date: "06 Februari 2026", desc: "Majlis Amanat Tahun 2026 oleh Ir. Maria Binti Marcus bertempat di Bilik Latihan BIXA.", category: "Program Utama", img: "BERITA 1.JPG" },
                { title: "Sesi Libat Urus Bersama Warga CPAB", date: "06 Februari 2026", desc: "Suasana sekitar sesi Amanat Pengarah Kanan yang dihadiri oleh seluruh kakitangan.", category: "Aktiviti", img: "BERITA 2.JPG" },
                { title: "Aspirasi Transformasi Pengurusan Aset", date: "06 Februari 2026", desc: "Penekanan terhadap nilai integriti dan amalan terbaik dalam mendepani cabaran 2026.", category: "Informasi", img: "BERITA 3.JPG" }
            ];

            const publicationsData = [
                { title: "Pelan Strategik CPAB 2021-2025", date: "Januari 2021", img: "Terbitan 1.jpg", link: "https://drive.google.com/drive/folders/141kBpDPblpipDDHkGv2dkJHcZrU4Hrie?usp=sharing", desc: "Dokumen komprehensif hala tuju strategik CPAB." },
                { title: "Garis Panduan Tatacara Pengurusan Aset", date: "Februari 2026", img: "Terbitan 2.jpg", link: "https://drive.google.com/drive/folders/141kBpDPblpipDDHkGv2dkJHcZrU4Hrie?usp=sharing", desc: "Piawaian proses kerja bagi pengurusan aset." },
                { title: "Manual Pengguna Sistem MySPATA", date: "Mac 2026", img: "Terbitan 3.jpg", link: "https://drive.google.com/drive/folders/141kBpDPblpipDDHkGv2dkJHcZrU4Hrie?usp=sharing", desc: "Panduan langkah demi langkah pendaftaran aset." }
            ];

            const archiveData = [
                { t: "Sambutan Hari Raya CPAB 2025", d: "15 April 2025", c: "Sosial", desc: "Majlis sambutan perayaan peringkat cawangan meraikan ukhuwah warga CPAB.", images: ["Arkib_Sosial_1.jpg", "Arkib_Sosial_2.jpg", "Arkib_Sosial_3.jpg", "Arkib_Sosial_4.jpg", "Arkib_Sosial_5.jpg"] },
                { t: "Kursus Pemantapan MySPATA", d: "22 Mac 2025", c: "Latihan", desc: "Latihan intensif pemantapan penggunaan sistem pendaftaran aset.", images: ["Arkib_Latihan_1.jpg", "Arkib_Latihan_2.jpg", "Arkib_Latihan_3.jpg", "Arkib_Latihan_4.jpg", "Arkib_Latihan_5.jpg"] },
                { t: "Taklimat Integriti & Rasuah", d: "18 November 2024", c: "Integriti", desc: "Program kesedaran memperkasakan nilai integriti organisasi.", images: ["Arkib_Integriti_1.jpg", "Arkib_Integriti_2.jpg", "Arkib_Integriti_3.jpg", "Arkib_Integriti_4.jpg", "Arkib_Integriti_5.jpg"] }
            ];

            const sparDocs = ["1. Dasar Anti Rasuah", "2. Bingkisan Integriti", "3. Carta Perbatuan SPAR CPAB", "4. Dokumen Prosedur SPB", "5. Laporan Audit Dalaman SPAR SPB", "6. Pelan Pengurusan Risiko Antirasuah CPAB", "7. Laporan Pemantauan Pelan Pengurusan Risiko Rasuah CPAB", "8. Pelan Antirasuah Organisasi JKR Malaysia 2021-2025", "9. Polisi Whistleblowing JKR", "10. Hari Integriti CPAB", "11. Maklumat Am SPAR", "12. Daftar Risiko SPAR CPAB"];
            const eksaDocs = ["1. Dasar EKSA CPAB", "2. Jawatankuasa Induk EKSA", "3. Garis Panduan Amalan EKSA", "4. Jadual Gotong-Royong 2026", "5. Laporan Audit Kendiri EKSA", "6. Koleksi Inovasi EKSA", "7. Maklumat Zon EKSA", "8. Slogan & Identiti EKSA CPAB"];

            // Data Direktori Pegawai (Lengkap berdasarkan semua unit dalam Struktur)
            const fullDirectory = [
                { 
                    bahagian: "Pejabat Pengarah", 
                    units: [
                        { unitName: "Pejabat Pengarah Kanan CPAB", staff: [{ name: "Ir. MARIA BINTI MARCUS", position: "Pengarah Kanan / Gred Utama B", ext: "7002", email: "maria_marcus@jkr.gov.my" }, { name: "FARIDAH BINTI ZULKIFLI", position: "Setiausaha Pejabat / Gred N6", ext: "7003", email: "zfaridah@jkr.gov.my" }] },
                        { unitName: "Pejabat Pengarah BPPK", staff: [{ name: "Ir. ROSLAN BIN MOHD SALLEH", position: "Jurutera Awam Penguasa Kanan / Gred J14", ext: "-", email: "roslanms@jkr.gov.my" }] },
                        { unitName: "Pejabat Pengarah BPPA", staff: [{ name: "Ir. SIAW WAI SAN", position: "Jurutera Awam Penguasa Kanan / Gred J14", ext: "7104", email: "wssiaw@jkr.gov.my" }] }
                    ] 
                },
                { 
                    bahagian: "Bahagian Pengurusan Projek Kompleks (BPPK)", 
                    units: [
                        { unitName: "Unit Kompetensi Dan Amalan TERBAIK (UKAT)", staff: [] },
                        { unitName: "Unit Pemantauan Prestasi Projek (UPPP)", staff: [] },
                        { unitName: "Unit Pengurusan Nilai (UPN)", staff: [] },
                        { unitName: "Unit Dasar dan Transformasi (UDT)", staff: [] },
                        { unitName: "Unit Building Information Modelling (UBIM)", staff: [] },
                        { unitName: "Unit Enterprise Content and Knowledge Management (UECKM)", staff: [] }
                    ] 
                },
                {
                    bahagian: "Bahagian Pengurusan Korporat dan Strategik (BPKS)",
                    units: [
                        { unitName: "Unit Korporat, Kualiti Dan Pengurusan Aset (UKKPA)", staff: [] },
                        { unitName: "Unit Khidmat Pengurusan (UKP)", staff: [] }
                    ]
                },
                {
                    bahagian: "Bahagian Perundingan Pengurusan Aset (BPPA)",
                    units: [
                        { unitName: "Unit Perundingan Pengurusan Aset Kerajaan (UPPAK)", staff: [] },
                        { unitName: "Unit Perundingan Pengurusan Aset Menyeluruh (UPPAM)", staff: [] },
                        { unitName: "Unit Perundingan Pengurusan Fasiliti (UPPF)", staff: [] },
                        { unitName: "Unit Pembangunan Kapasiti dan Transformasi (UPKT)", staff: [] },
                        { unitName: "Unit Pemantauan Projek Senggara (UPPS)", staff: [] },
                        { unitName: "Unit Perundingan Kontrak Dan Ukur Bahan (UPKUB)", staff: [] }
                    ]
                }
            ];

            const NavItem = ({ id, label, icon }) => (
                <button onClick={() => { setActiveTab(id); setIsMenuOpen(false); window.scrollTo(0,0); }} className={`flex items-center gap-2 px-5 py-2.5 rounded-xl transition-all duration-300 group ${activeTab === id ? 'tab-active' : 'hover:bg-white/10 text-white font-medium'}`}>
                    <Icon name={icon} size={18} className={`${activeTab === id ? 'text-white' : 'text-cyan-200 group-hover:text-white'}`} />
                    <span className="text-[11px] uppercase tracking-wider whitespace-nowrap">{label}</span>
                </button>
            );

            const ImageWithFallback = ({ src, alt, className, type = "news" }) => {
                const [error, setError] = useState(false);
                if (error) return <div className={`flex flex-col items-center justify-center bg-slate-100 text-slate-400 p-4 text-center ${className}`}><Icon name={type === "news" ? "megaphone" : type === "arkib" ? "image" : "fileText"} size={40} className="opacity-20 mb-2" /><span className="text-[8px] font-bold uppercase tracking-widest leading-tight">{src}</span></div>;
                return <img src={src} alt={alt} className={className} onError={() => setError(true)} />;
            };

            return (
                <div className="min-h-screen flex flex-col text-[#334155]">
                    {/* Modal Arkib, Direktori, Publications... */}
                    {selectedArchiveItem && (
                        <div className="fixed inset-0 z-[1100] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-md animate-fade-in" onClick={() => setSelectedArchiveItem(null)}>
                            <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-6xl overflow-hidden relative max-h-[95vh] flex flex-col" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setSelectedArchiveItem(null)} className="absolute top-6 right-6 p-2 bg-slate-100 hover:bg-orange-100 rounded-full transition-colors z-20 text-[#334155]"><Icon name="x" size={20} /></button>
                                <div className="bg-[#179898] p-8 text-white shrink-0">
                                    <div className="flex items-center gap-3 mb-2"><span className="bg-[#fda927] text-white text-[9px] font-black uppercase px-3 py-1 rounded-full">{selectedArchiveItem.c}</span><span className="text-[10px] font-bold opacity-70 uppercase tracking-widest">{selectedArchiveItem.d}</span></div>
                                    <h3 className="font-black text-xl lg:text-2xl uppercase tracking-tight leading-tight">{selectedArchiveItem.t}</h3>
                                </div>
                                <div className="p-8 lg:p-10 overflow-y-auto space-y-10">
                                    <div className="bg-slate-50 p-8 rounded-[2rem] border-l-8 border-[#fda927] text-[#334155]"><h4 className="font-black text-[#179898] text-[10px] uppercase tracking-[0.2em] mb-3">Laporan Ringkas Aktiviti</h4><p className="text-slate-600 font-medium leading-relaxed italic text-sm">"{selectedArchiveItem.desc}"</p></div>
                                    <div className="space-y-6">
                                        <h4 className="font-black text-[#179898] text-[10px] uppercase tracking-[0.2em] flex items-center gap-2"><Icon name="image" size={16}/> Galeri Gambar Aktiviti</h4>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 auto-rows-fr">
                                            {selectedArchiveItem.images.map((img, idx) => (
                                                <div key={idx} className={`rounded-3xl overflow-hidden shadow-lg border-4 border-slate-100 bg-slate-100 relative group card-hover ${idx === 2 ? 'md:row-span-2 aspect-[3/4] md:aspect-auto' : 'aspect-video'}`}>
                                                    <ImageWithFallback src={img} alt={`Gbr ${idx+1}`} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-1000" type="arkib" />
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="flex justify-center pt-4"><button onClick={() => setSelectedArchiveItem(null)} className="px-12 py-4 bg-slate-800 text-white rounded-full font-black text-[10px] uppercase hover:bg-[#fda927] transition-all shadow-lg">Tutup Paparan</button></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {selectedDirektoriUnit && (
                        <div className="fixed inset-0 z-[1100] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-md animate-fade-in" onClick={() => setSelectedDirektoriUnit(null)}>
                            <div className="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-3xl overflow-hidden relative text-[#334155]" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setSelectedDirektoriUnit(null)} className="absolute top-6 right-6 p-2 bg-slate-100 hover:bg-orange-100 rounded-full transition-colors z-20 text-[#334155]"><Icon name="x" size={20} /></button>
                                <div className="bg-[#179898] p-8 text-white shrink-0">
                                    <h3 className="font-bold text-lg uppercase tracking-tight">{selectedDirektoriUnit.unitName}</h3>
                                </div>
                                <div className="p-8 max-h-[70vh] overflow-y-auto space-y-4">
                                    {selectedDirektoriUnit.staff && selectedDirektoriUnit.staff.length > 0 ? selectedDirektoriUnit.staff.map((staff, idx) => (
                                        <div key={idx} className="bg-slate-50 p-6 rounded-2xl border border-slate-100 flex flex-col md:flex-row justify-between gap-4 hover:border-cyan-500 transition-colors">
                                            <div><h4 className="font-extrabold text-[#179898] uppercase text-sm mb-1">{staff.name}</h4><p className="text-[10px] font-bold text-slate-400 uppercase italic mb-3">{staff.position}</p></div>
                                            <div className="flex flex-col gap-2"><div className="flex items-center gap-2 text-xs font-medium"><Icon name="mail" size={14} className="text-[#fda927]"/><span>{staff.email}</span></div><div className="flex items-center gap-2 text-[10px] font-bold text-slate-500 uppercase"><Icon name="phone" size={12} className="text-[#179898]"/> Samb: {staff.ext}</div></div>
                                        </div>
                                    )) : <div className="text-center py-20 opacity-40 uppercase font-black text-xs tracking-[0.2em]">Maklumat Sedang Dikemaskini</div>}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Navigation Header */}
                    <header className="bg-white/90 sticky top-0 z-[500] glass-effect border-b border-slate-100 text-[#334155]">
                        <div className="container mx-auto px-6 py-4 flex justify-between items-center">

                                            </div>

                        {activeTab === 'profil' && (

                                <div className="space-y-12 text-[#334155] text-[#334155]">
                                    {fullDirectory.map((bahagian, bIdx) => (
                                        <div key={bIdx} className="space-y-6">

                                            </div>

ext-white text-white text-white text-white text-white"><Icon name="facebook" size={24} className="group-hover:scale-110 transition-transform text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white" /></a><a href="https://x.com/JKRCPAB" target="_blank" className="bg-white/5 p-4 rounded-2xl hover:bg-cyan-500 transition-all shadow-lg text-white group text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white"><Icon name="twitter" size={24} className="group-hover:scale-110 transition-transform text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white" /></a></div></div><div className="pt-10 border-t border-white/5 text-[10px] text-slate-500 font-bold uppercase tracking-widest text-center md:text-left opacity-50 text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white text-white">Hak Cipta Terpelihara © 2026 Cawangan Perancangan Aset Bersepadu.<br/>Jabatan Kerja Raya Malaysia.</div></div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
